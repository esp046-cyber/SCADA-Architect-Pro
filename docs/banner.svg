<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="bt bd" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="bt">SCADA Architect Pro</title>
  <desc id="bd">Topology and requirement mapping studio for SCADA engineers, with a sample network of PLCs, a switch, an HMI and remote I/O.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1e293b"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="1278" height="338" rx="19" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- logo mark -->
  <g transform="translate(56 70) scale(0.40)">
    <rect width="512" height="512" rx="112" fill="#0b1220"/>
    <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#22d3ee" stroke-opacity=".35" stroke-width="6"/>
    <g fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round">
      <line x1="146" y1="160" x2="226" y2="228"/>
      <line x1="366" y1="160" x2="286" y2="228"/>
      <line x1="247" y1="398" x2="247" y2="312" stroke="#a3e635" stroke-width="5"/>
      <line x1="265" y1="398" x2="265" y2="312" stroke="#a3e635" stroke-width="5"/>
    </g>
    <circle cx="146" cy="160" r="44" fill="#0f172a" stroke="#f97316" stroke-width="10"/>
    <circle cx="146" cy="160" r="14" fill="#f97316"/>
    <circle cx="366" cy="160" r="44" fill="#0f172a" stroke="#14b8a6" stroke-width="10"/>
    <circle cx="366" cy="160" r="14" fill="#14b8a6"/>
    <circle cx="256" cy="398" r="44" fill="#0f172a" stroke="#facc15" stroke-width="10"/>
    <circle cx="256" cy="398" r="14" fill="#facc15"/>
    <rect x="190" y="190" width="132" height="132" rx="28" fill="#0f172a" stroke="#22d3ee" stroke-width="12"/>
    <rect x="234" y="234" width="44" height="44" rx="8" fill="#22d3ee"/>
  </g>

  <!-- title block -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="288" y="138" font-size="46" font-weight="800" fill="url(#ttl)" letter-spacing="-1">SCADA Architect Pro</text>
    <text x="290" y="178" font-size="18" fill="#94a3b8">Topology &amp; requirement mapping studio for automation engineers</text>

    <g font-size="14" font-weight="600" text-anchor="middle">
      <rect x="290" y="214" width="84" height="30" rx="15" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".6"/>
      <text x="332" y="234" fill="#67e8f9">AVEVA</text>
      <rect x="384" y="214" width="92" height="30" rx="15" fill="#0f172a" stroke="#14b8a6" stroke-opacity=".6"/>
      <text x="430" y="234" fill="#5eead4">Siemens</text>
      <rect x="486" y="214" width="98" height="30" rx="15" fill="#0f172a" stroke="#f97316" stroke-opacity=".6"/>
      <text x="535" y="234" fill="#fdba74">Rockwell</text>
      <rect x="594" y="214" width="62" height="30" rx="15" fill="#0f172a" stroke="#60a5fa" stroke-opacity=".6"/>
      <text x="625" y="234" fill="#93c5fd">GE</text>
    </g>
    <text x="290" y="285" font-size="15" fill="#64748b">Design  ·  Map requirements  ·  Roll up I/O  ·  Export BOM  ·  Works offline as a PWA</text>
  </g>

  <!-- sample topology (right) -->
  <g transform="translate(244 33) scale(0.8)" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <!-- edges -->
    <g fill="none" stroke-width="3" stroke-linecap="round">
      <path d="M 905 90 C 905 125, 880 125, 880 160" stroke="#22d3ee"/>
      <path d="M 1105 90 C 1105 125, 1080 125, 1080 160" stroke="#22d3ee"/>
      <path d="M 880 205 C 880 235, 990 215, 990 250" stroke="#f97316"/>
      <path d="M 1080 205 C 1080 235, 990 215, 990 250" stroke="#f97316"/>
      <path d="M 1055 271 L 1130 271" stroke="#a3e635" stroke-width="8"/>
      <path d="M 1055 271 L 1130 271" stroke="#0b1220" stroke-width="3"/>
    </g>
    <!-- nodes -->
    <g text-anchor="middle">
      <rect x="835" y="50" width="140" height="40" rx="9" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
      <text x="905" y="75" fill="#e2e8f0">HMI / InTouch</text>
      <rect x="1035" y="50" width="140" height="40" rx="9" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
      <text x="1105" y="75" fill="#e2e8f0">Historian</text>

      <rect x="820" y="160" width="120" height="45" rx="9" fill="#0f172a" stroke="#f97316" stroke-width="2.5"/>
      <text x="880" y="187" fill="#e2e8f0">AB PLC 1</text>
      <rect x="1020" y="160" width="120" height="45" rx="9" fill="#0f172a" stroke="#14b8a6" stroke-width="2.5"/>
      <text x="1080" y="187" fill="#e2e8f0">Siemens PLC</text>

      <rect x="925" y="250" width="130" height="42" rx="9" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
      <text x="990" y="276" fill="#e2e8f0">Switch</text>
      <rect x="1130" y="250" width="100" height="42" rx="9" fill="#0f172a" stroke="#fb923c" stroke-width="2"/>
      <text x="1180" y="276" fill="#e2e8f0">RIO · 120</text>
    </g>
    <!-- connection labels -->
    <g font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">
      <text x="868" y="125">OPC UA</text>
      <text x="1116" y="125">SQL</text>
      <text x="1092" y="232">EtherNet/IP</text>
      <text x="1093" y="256">Dual Ring</text>
    </g>
  </g>
</svg>
